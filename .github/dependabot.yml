version: 2

updates:
  # Keep the Python requirements and uv.lock together in one reviewable PR.
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/London"
    commit-message:
      prefix: "chore(deps)"
    groups:
      # Keep the identifier short because Dependabot includes it in PR titles,
      # which this repository limits to 72 characters.
      python:
        patterns:
          - "*"
    open-pull-requests-limit: 1

  # Actions stay pinned to immutable SHAs; Dependabot updates the SHA and
  # human-readable version comment as one batch.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:15"
      timezone: "Europe/London"
    commit-message:
      prefix: "ci"
    groups:
      # Keep the identifier short enough for generated single-update titles.
      actions:
        patterns:
          - "*"
    open-pull-requests-limit: 1
