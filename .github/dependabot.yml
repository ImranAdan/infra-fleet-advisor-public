version: 2

updates:
  # Keep the Python requirements and uv.lock together in one reviewable PR.
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/London"
    commit-message:
      prefix: "deps"
    groups:
      python-dependencies:
        patterns:
          - "*"
    open-pull-requests-limit: 1

  # Actions stay pinned to immutable SHAs; Dependabot updates the SHA and
  # human-readable version comment as one batch.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:15"
      timezone: "Europe/London"
    commit-message:
      prefix: "ci"
    groups:
      github-actions:
        patterns:
          - "*"
    open-pull-requests-limit: 1
