name: Merge judge

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review, labeled, unlabeled]

permissions:
  contents: read
  issues: write
  pull-requests: read

concurrency:
  group: merge-judge-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  judge:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Only trusted base-branch code is checked out. PR code is read as data.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false

      - name: Judge surfaced decisions
        env:
          GH_TOKEN: ${{ github.token }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          EVENT_ACTION: ${{ github.event.action }}
          EVENT_ACTOR: ${{ github.actor }}
          EVENT_LABEL: ${{ github.event.label.name || '' }}
          REPOSITORY_OWNER: ${{ github.repository_owner }}
          PR: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: python3 .claude/skills/merge-gate/judge.py "$PR" "$HEAD_SHA"
