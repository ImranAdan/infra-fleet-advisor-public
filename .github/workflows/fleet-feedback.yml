name: Propose fleet decision feedback

# Closed advisor issues can become declared policy, but never directly. This
# workflow reads only issue identity, state, author, and a closed label
# vocabulary, then proposes the resulting policy change in this repository.
# A maintainer must still merge the pull request.
on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: fleet-decision-feedback

env:
  BRANCH: advisor/feedback-wontfix
  TARGET_REPO: ImranAdan/infra-fleet-public

jobs:
  propose:
    name: Propose accepted trade-offs
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the advisor
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.11"

      - name: Set up uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true

      - name: Install locked dependencies
        run: make setup

      # This token is installed only on infra-fleet-public and downscoped to
      # issues:read. It cannot read fleet code or change issues, labels, or PRs.
      - name: Create issues-read fleet token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.FLEET_ISSUES_APP_CLIENT_ID }}
          private-key: ${{ secrets.FLEET_ISSUES_APP_PRIVATE_KEY }}
          owner: ImranAdan
          repositories: infra-fleet-public
          permission-issues: read

      # The adapter deliberately projects away issue title, body, and comments.
      # The output policy is written only when at least one complete, valid
      # decision maps unambiguously to a current recommendation.
      - name: Build the feedback plan
        id: plan
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          APP_BOT_LOGIN: ${{ steps.app-token.outputs.app-slug }}[bot]
        run: |
          uv run infra-fleet-advisor feedback-plan \
            --report reports/report.json \
            --policy policy.yaml \
            --app-bot-login "$APP_BOT_LOGIN" \
            --output-policy "$RUNNER_TEMP/feedback-policy.yaml" \
            --output-plan "$RUNNER_TEMP/feedback-plan.json"
          count="$(jq -er '.additions | length' "$RUNNER_TEMP/feedback-plan.json")"
          status="$(jq -er '.status' "$RUNNER_TEMP/feedback-plan.json")"
          signature="$(jq -er '.signature' "$RUNNER_TEMP/feedback-plan.json")"
          marker="$(jq -er '.marker' "$RUNNER_TEMP/feedback-plan.json")"
          {
            echo "count=$count"
            echo "status=$status"
            echo "signature=$signature"
            echo "marker=$marker"
          } >> "$GITHUB_OUTPUT"

      # One workflow-owned branch represents the current proposal. GitHub JSON
      # is captured as untrusted input; typed code validates repository, branch,
      # bot author, markers, and the allowed create/update/cancel transitions.
      - name: Decide whether to propose
        id: decision
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api \
            --method GET \
            "repos/${GITHUB_REPOSITORY}/pulls" \
            -f state=open \
            -f head="${GITHUB_REPOSITORY_OWNER}:${BRANCH}" \
            -f per_page=2 \
            > "$RUNNER_TEMP/open-feedback-prs.json"
          gh api \
            --method GET \
            "repos/${GITHUB_REPOSITORY}/pulls" \
            -f state=all \
            -f head="${GITHUB_REPOSITORY_OWNER}:${BRANCH}" \
            -f sort=created \
            -f direction=desc \
            -f per_page=1 \
            > "$RUNNER_TEMP/latest-feedback-prs.json"

          branch_tip="$(git ls-remote --heads origin "refs/heads/${BRANCH}" | awk '{print $1}')"
          branch_matches_plan=false
          if [ -n "$branch_tip" ] && [ "$(jq -r 'length' "$RUNNER_TEMP/open-feedback-prs.json")" = "0" ] &&
            [ "${{ steps.plan.outputs.count }}" != "0" ]; then
            git fetch --no-tags origin "$branch_tip"
            parents="$(git rev-list --parents -n 1 "$branch_tip")"
            parent_count="$(wc -w <<< "$parents" | tr -d ' ')"
            parent="$(awk '{print $2}' <<< "$parents")"
            changed_paths="$(git diff --name-only "$parent" "$branch_tip")"
            git show "${branch_tip}:policy.yaml" > "$RUNNER_TEMP/remote-feedback-policy.yaml"
            if [ "$parent_count" = "2" ] &&
              git merge-base --is-ancestor "$parent" HEAD &&
              [ "$changed_paths" = "policy.yaml" ] &&
              cmp -s "$RUNNER_TEMP/remote-feedback-policy.yaml" \
                "$RUNNER_TEMP/feedback-policy.yaml"; then
              branch_matches_plan=true
            fi
          fi
          decision_args=(
            feedback-publication-decision
            --plan "$RUNNER_TEMP/feedback-plan.json"
            --open-prs "$RUNNER_TEMP/open-feedback-prs.json"
            --latest-prs "$RUNNER_TEMP/latest-feedback-prs.json"
            --repository "$GITHUB_REPOSITORY"
            --branch "$BRANCH"
          )
          if [ -n "$branch_tip" ]; then
            decision_args+=(--branch-tip "$branch_tip")
          fi
          if [ "$branch_matches_plan" = "true" ]; then
            decision_args+=(--branch-matches-plan)
          fi
          decision="$(uv run infra-fleet-advisor "${decision_args[@]}")"
          action="$(jq -er '.action' <<< "$decision")"
          reason="$(jq -er '.reason' <<< "$decision")"
          open_number="$(jq -r '.open_pr_number // ""' <<< "$decision")"
          {
            echo "action=$action"
            echo "reason=$reason"
            echo "open_number=$open_number"
            echo "branch_tip=$branch_tip"
          } >> "$GITHUB_OUTPUT"
          echo "Feedback publication decision: $action ($reason)."

      # A reopened issue or removed decision label revokes an unmerged
      # proposal. Close only the workflow's own PR, and mark it as cancelled so
      # it cannot later be mistaken for a human decline of that feedback plan.
      - name: Withdraw a stale policy pull request
        if: steps.decision.outputs.action == 'cancel'
        env:
          GH_TOKEN: ${{ github.token }}
          OPEN_PR_NUMBER: ${{ steps.decision.outputs.open_number }}
          FEEDBACK_STATUS: ${{ steps.plan.outputs.status }}
        run: |
          {
            echo '<!-- infra-fleet-advisor-feedback-cancelled -->'
            echo
            echo "The workflow withdrew this proposal because no current validated"
            echo "feedback additions remain (feedback status: $FEEDBACK_STATUS)."
            echo "No fleet issue or policy was changed by this cancellation."
          } > "$RUNNER_TEMP/cancelled-feedback-pr-body.md"
          gh pr edit "$OPEN_PR_NUMBER" --body-file "$RUNNER_TEMP/cancelled-feedback-pr-body.md"
          gh pr close "$OPEN_PR_NUMBER"

      - name: Compose the policy pull request
        if: steps.decision.outputs.action == 'create' || steps.decision.outputs.action == 'update'
        env:
          FEEDBACK_MARKER: ${{ steps.plan.outputs.marker }}
        run: |
          cp "$RUNNER_TEMP/feedback-policy.yaml" policy.yaml
          {
            printf '%s\n\n' "$FEEDBACK_MARKER"
            echo "Closed fleet issues proposed as owner-accepted trade-offs:"
            echo
            jq -r --arg target "$TARGET_REPO" '.additions[] |
              "- [Fleet issue #\(.issue_number)](https://github.com/\($target)/issues/\(.issue_number)): `\(.concern_key)` — `\(.reason_label)` (`\(.fingerprint)`)"' \
              "$RUNNER_TEMP/feedback-plan.json"
            echo
            echo "Only issue number, state, workflow-bot author, and validated labels were read."
            echo "Issue titles, bodies, and comments were not imported. Merging this PR records"
            echo "the decisions in policy; closing it declines this exact feedback plan."
          } > "$RUNNER_TEMP/feedback-pr-body.md"

      - name: Open or update the policy pull request
        if: steps.decision.outputs.action == 'create' || steps.decision.outputs.action == 'update'
        env:
          GH_TOKEN: ${{ github.token }}
          OPEN_PR_NUMBER: ${{ steps.decision.outputs.open_number }}
          BRANCH_TIP: ${{ steps.decision.outputs.branch_tip }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$BRANCH"
          git add policy.yaml
          git commit -m "chore(policy): record fleet wontfix decisions"

          if [ -n "$BRANCH_TIP" ]; then
            lease="--force-with-lease=refs/heads/${BRANCH}:${BRANCH_TIP}"
          else
            lease="--force-with-lease=refs/heads/${BRANCH}:"
          fi
          git push "$lease" \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            "HEAD:refs/heads/$BRANCH"

          if [ -n "$OPEN_PR_NUMBER" ]; then
            gh pr edit "$OPEN_PR_NUMBER" --body-file "$RUNNER_TEMP/feedback-pr-body.md"
            echo "Updated the open feedback pull request."
          else
            gh pr create \
              --base "${{ github.event.repository.default_branch }}" \
              --head "$BRANCH" \
              --title "chore(policy): record fleet wontfix decisions" \
              --body-file "$RUNNER_TEMP/feedback-pr-body.md"
          fi
