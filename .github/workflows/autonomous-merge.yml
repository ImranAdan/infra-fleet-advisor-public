name: Autonomous merge

# Trusted default-branch code evaluates opted-in, same-repository
# pull requests. The merge gate remains the only authority and binds a merge to
# the exact head it evaluated. PARK, JUDGE and BLOCKED remain open.
on:
  workflow_run:
    workflows: [Quality]
    types: [completed]
  status:
  schedule:
    # Recovery only; Quality and external review normally wake the worker.
    - cron: "7 */6 * * *"
  workflow_dispatch:
    inputs:
      priority_pr:
        description: Pull request to evaluate first
        required: false
        type: string

permissions:
  actions: write
  checks: read
  contents: write
  issues: read
  pull-requests: write
  statuses: read

concurrency:
  group: autonomous-merge
  cancel-in-progress: false

jobs:
  merge:
    # Quality publishes a bridge status for generated reports. Its
    # workflow_run event already wakes this worker, so only the external status
    # that can finish later needs another runner.
    if: github.event_name != 'status' || github.event.context == 'CodeRabbit'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out trusted merge code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Test the candidate selector and merge gate
        run: |
          python3 .github/scripts/autonomous_merge.py --self-test
          python3 .claude/skills/merge-gate/merge_ready.py --self-test

      - name: Merge evidence-approved pull requests
        env:
          GH_TOKEN: ${{ github.token }}
          AUTONOMOUS_MERGE_MIN_AGE_SECONDS: "0"
          AUTONOMOUS_MERGE_RUN_ID: ${{ github.run_id }}
          AUTONOMOUS_MERGE_PRIORITY_PR: ${{ inputs.priority_pr || github.event.workflow_run.pull_requests[0].number || '' }}
          AUTONOMOUS_MERGE_PRIORITY_SHA: ${{ github.event_name == 'status' && github.event.sha || '' }}
          AUTONOMOUS_MERGE_POST_MERGE_WORKFLOW: fleet-issues.yml
          AUTONOMOUS_MERGE_POST_MERGE_HEAD: advisory/latest
        run: python3 .github/scripts/autonomous_merge.py
