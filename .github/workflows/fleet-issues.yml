name: Publish fleet advisory issues

# The merged report PR is the decision record. Only trusted default-branch
# code runs; PR text and report contents are bounded, revalidated data.
on:
  pull_request_target:
    types: [closed]
    branches: [main]
    paths: [reports/report.json]
  workflow_dispatch:
    inputs:
      report_pr:
        description: Merged report PR number to retry
        required: true
        type: string

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: fleet-issue-publication

env:
  TARGET_REPO: ImranAdan/infra-fleet-public

jobs:
  publish:
    name: Publish accepted recommendations
    if: >-
      vars.FLEET_ISSUES_ENABLED == 'true' &&
      (github.event_name == 'workflow_dispatch' || github.event.pull_request.merged == true)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out trusted advisor code and current policy
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.11"

      - name: Set up uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true

      - name: Install locked dependencies
        run: make setup

      - name: Verify the merged report PR
        id: approval
        env:
          GH_TOKEN: ${{ github.token }}
          REPORT_PR: ${{ github.event.pull_request.number || inputs.report_pr }}
        run: |
          if [[ ! "$REPORT_PR" =~ ^[1-9][0-9]{0,9}$ ]]; then
            echo '::error::A positive merged report PR number is required.'
            exit 1
          fi
          gh api "repos/${GITHUB_REPOSITORY}/pulls/${REPORT_PR}" \
            > "$RUNNER_TEMP/report-pr.json"
          gh api "repos/${GITHUB_REPOSITORY}/pulls/${REPORT_PR}/files?per_page=3" \
            > "$RUNNER_TEMP/report-pr-files.json"
          uv run --frozen infra-fleet-advisor report-approval \
            --pull-request "$RUNNER_TEMP/report-pr.json" \
            --files "$RUNNER_TEMP/report-pr-files.json" \
            --number "$REPORT_PR" --output "$RUNNER_TEMP/report-approval.json"
          sha="$(jq -er '.merge_commit_sha' "$RUNNER_TEMP/report-approval.json")"
          printf 'sha=%s\n' "$sha" >> "$GITHUB_OUTPUT"

      - name: Materialize the approved report
        id: snapshot
        env:
          REPORT_MERGE_SHA: ${{ steps.approval.outputs.sha }}
        run: |
          git merge-base --is-ancestor "$REPORT_MERGE_SHA" HEAD
          mkdir -p "$RUNNER_TEMP/approved-report"
          git show "${REPORT_MERGE_SHA}:reports/report.json" \
            > "$RUNNER_TEMP/approved-report/report.json"
          if ! cmp -s reports/report.json "$RUNNER_TEMP/approved-report/report.json"; then
            echo 'current=false' >> "$GITHUB_OUTPUT"
            echo 'This report PR has been superseded by a newer merged report; nothing published.' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          echo 'current=true' >> "$GITHUB_OUTPUT"

      - name: Wait for matching policy and intent
        id: readiness
        if: steps.snapshot.outputs.current == 'true'
        run: |
          status="$(uv run --frozen infra-fleet-advisor report-readiness \
            --report "$RUNNER_TEMP/approved-report/report.json" \
            --policy policy.yaml --intent-dir intent)"
          ready="$(jq -er '.ready | tostring' <<< "$status")"
          echo "ready=$ready" >> "$GITHUB_OUTPUT"
          if [ "$ready" != 'true' ]; then
            echo 'Waiting for a report approved under current policy and intent.' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Build the approved issue plan
        id: plan
        if: steps.readiness.outputs.ready == 'true'
        run: |
          uv run --frozen infra-fleet-advisor issue-plan \
            --report "$RUNNER_TEMP/approved-report/report.json" \
            --policy policy.yaml --intent-dir intent \
            --approval "$RUNNER_TEMP/report-approval.json" \
            --output "$RUNNER_TEMP/fleet-issue-plan.json"
          count="$(jq -er '.actions | length' "$RUNNER_TEMP/fleet-issue-plan.json")"
          echo "count=$count" >> "$GITHUB_OUTPUT"
          jq -r '"Decision record: https://github.com/ImranAdan/infra-fleet-advisor-public/pull/\(.approval.number)", "Eligible actions: \(.actions | length)", "Deferred for incomplete collection: \(.deferred_count)"' \
            "$RUNNER_TEMP/fleet-issue-plan.json" >> "$GITHUB_STEP_SUMMARY"

      - name: Verify issue publisher credentials
        if: steps.readiness.outputs.ready == 'true' && steps.plan.outputs.count != '0'
        env:
          APP_CLIENT_ID: ${{ secrets.FLEET_ISSUES_APP_CLIENT_ID }}
          APP_PRIVATE_KEY: ${{ secrets.FLEET_ISSUES_APP_PRIVATE_KEY }}
        run: |
          missing=()
          [ -n "$APP_CLIENT_ID" ] || missing+=(FLEET_ISSUES_APP_CLIENT_ID)
          [ -n "$APP_PRIVATE_KEY" ] || missing+=(FLEET_ISSUES_APP_PRIVATE_KEY)
          if [ "${#missing[@]}" -ne 0 ]; then
            echo "::error::Issue publication is not configured. Missing: ${missing[*]}"
            exit 1
          fi

      - name: Create issues-only fleet token
        if: steps.readiness.outputs.ready == 'true' && steps.plan.outputs.count != '0'
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.FLEET_ISSUES_APP_CLIENT_ID }}
          private-key: ${{ secrets.FLEET_ISSUES_APP_PRIVATE_KEY }}
          owner: ImranAdan
          repositories: infra-fleet-public
          permission-issues: write

      - name: Create or update approved fleet records
        if: steps.readiness.outputs.ready == 'true' && steps.plan.outputs.count != '0'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          APP_BOT_LOGIN: ${{ steps.app-token.outputs.app-slug }}[bot]
        run: |
          uv run --frozen infra-fleet-advisor publish-issues \
            --report "$RUNNER_TEMP/approved-report/report.json" \
            --policy policy.yaml --intent-dir intent \
            --approval "$RUNNER_TEMP/report-approval.json" \
            --app-bot-login "$APP_BOT_LOGIN"
