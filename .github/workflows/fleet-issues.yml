name: Publish fleet advisory issues

# Turns a merged, revalidated report into deduplicated issues in the fleet.
# This workflow can write issues and comments, but its GitHub App token has no
# contents or pull-request permission. It never changes fleet code or issue
# state, and it never reads issue prose back into analysis or policy.
on:
  push:
    branches: [main]
    paths: [reports/report.json]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fleet-issue-publication

env:
  TARGET_REPO: ImranAdan/infra-fleet-public

jobs:
  publish:
    name: Publish accepted recommendations
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Always consume the merged report and policy from the default branch,
      # including for manual retries dispatched from another ref.
      - name: Check out the advisor
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.11"

      - name: Set up uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true

      - name: Install locked dependencies
        run: make setup

      # Revalidates source identity, policy version, fingerprints, evidence,
      # suppression, accepted trade-offs, secret safety, and output bounds.
      # GitHub receives only this deterministic plan, never the raw report.
      - name: Build the issue plan
        id: plan
        run: |
          uv run infra-fleet-advisor issue-plan \
            --report reports/report.json \
            --policy policy.yaml \
            --output "$RUNNER_TEMP/fleet-issue-plan.json"
          count="$(jq -er '.actions | length' "$RUNNER_TEMP/fleet-issue-plan.json")"
          echo "count=$count" >> "$GITHUB_OUTPUT"

      # The installation is scoped to infra-fleet-public and the generated
      # token requests only issues:write. It cannot read or modify fleet code.
      - name: Create issues-only fleet token
        if: steps.plan.outputs.count != '0'
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.FLEET_ISSUES_APP_CLIENT_ID }}
          private-key: ${{ secrets.FLEET_ISSUES_APP_PRIVATE_KEY }}
          owner: ImranAdan
          repositories: infra-fleet-public
          permission-issues: write

      - name: Create or update issue records
        if: steps.plan.outputs.count != '0'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          APP_BOT_LOGIN: ${{ steps.app-token.outputs.app-slug }}[bot]
        run: |
          uv run infra-fleet-advisor publish-issues \
            --report reports/report.json \
            --policy policy.yaml \
            --app-bot-login "$APP_BOT_LOGIN"
