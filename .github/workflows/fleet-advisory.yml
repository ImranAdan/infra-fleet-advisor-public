name: Fleet advisory report

# Runs one review pass over infra-fleet-public and proposes the resulting
# report as a pull request here. The fleet repository is only ever read: it is
# checked out, analyzed, and left untouched.
on:
  push:
    branches: [main]
    paths:
      - intent/**
      - policy.yaml
      - src/**
      - pyproject.toml
      - uv.lock
  schedule:
    - cron: "23 4 * * *"
  workflow_dispatch:
    inputs:
      target_ref:
        description: Ref of infra-fleet-public to review
        default: main
      synthesizer:
        description: anthropic (real model, needs ANTHROPIC_API_KEY) or stub (offline)
        type: choice
        options: [anthropic, stub]
        default: stub

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: fleet-advisory

env:
  BRANCH: advisory/latest
  TARGET_REPO: ImranAdan/infra-fleet-public

jobs:
  advise:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      HAS_REPORT_APP: ${{ secrets.ADVISOR_REPORT_APP_CLIENT_ID != '' && secrets.ADVISOR_REPORT_APP_PRIVATE_KEY != '' }}
    steps:
      # Pinned to the default branch, not the dispatch ref: the prior report
      # and the policy must come from merged state. Dispatching from a feature
      # branch would otherwise baseline lifecycle against an unmerged report.
      # persist-credentials is off on both checkouts so no token is left in
      # .git/config while repository code runs; the push authenticates itself.
      - name: Check out the advisor
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Check out the fleet under review
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: ${{ env.TARGET_REPO }}
          ref: ${{ inputs.target_ref || 'main' }}
          path: target
          persist-credentials: false

      - name: Resolve the reviewed commit
        id: target
        run: echo "sha=$(git -C target rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.11"

      # --frozen installs exactly what uv.lock pins and fails if the lock is
      # stale, so a rerun over the same advisor and fleet commits resolves the
      # same dependency set rather than picking up whatever satisfies
      # `anthropic>=1.2` that day.
      - name: Install the advisor from the lockfile
        run: |
          pip install "uv==0.9.14"
          uv sync --frozen --no-dev

      # App-authored PRs trigger ordinary pull_request quality checks. The
      # token is scoped to this advisor repo and is never passed to collectors.
      - name: Verify optional report delivery credentials
        env:
          REPORT_APP_ID: ${{ secrets.ADVISOR_REPORT_APP_CLIENT_ID }}
          REPORT_APP_KEY: ${{ secrets.ADVISOR_REPORT_APP_PRIVATE_KEY }}
        run: |
          if { [ -n "$REPORT_APP_ID" ] && [ -z "$REPORT_APP_KEY" ]; } || \
             { [ -z "$REPORT_APP_ID" ] && [ -n "$REPORT_APP_KEY" ]; }; then
            echo '::error::Report delivery needs both ADVISOR_REPORT_APP_CLIENT_ID and ADVISOR_REPORT_APP_PRIVATE_KEY, or neither.'
            exit 1
          fi

      - name: Create advisor report delivery token
        id: report-app
        if: env.HAS_REPORT_APP == 'true'
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.ADVISOR_REPORT_APP_CLIENT_ID }}
          private-key: ${{ secrets.ADVISOR_REPORT_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
          permission-pull-requests: write

      # Fails the job on any synthesis or provenance error rather than writing
      # an empty report: a report with no findings is indistinguishable from
      # "everything was fixed", and would mark every open finding resolved.
      - name: Run the review
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          prior=()
          if [ -f reports/report.json ]; then
            prior=(--prior-report reports/report.json)
          fi
          uv run infra-fleet-advisor review \
            --checkout target \
            --sha "${{ steps.target.outputs.sha }}" \
            --policy policy.yaml \
            --intent-dir intent \
            --output-dir "$RUNNER_TEMP/advisory" \
            --synthesizer "${{ inputs.synthesizer || 'stub' }}" \
            "${prior[@]}"

      # A closed, unmerged advisory PR created by this workflow is an explicit
      # decline at the report signature recorded in its body. Two 100-item pages
      # paired with a 199-record gate prove the history is complete or fail
      # closed. Trusted code selects the newest workflow-authored PR, so a newer
      # human PR cannot hide a decline and a newer workflow merge supersedes it.
      # The REST `head` filter includes this repository's owner, so a fork reusing
      # the branch name cannot forge a decision. PR prose remains untrusted.
      - name: Read bounded closed advisory history
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -o pipefail
          gh api \
            --method GET \
            "repos/${GITHUB_REPOSITORY}/pulls" \
            -f state=closed \
            -f head="${GITHUB_REPOSITORY_OWNER}:${BRANCH}" \
            -f sort=created \
            -f direction=desc \
            -f per_page=100 \
            -f page=1 \
            > "$RUNNER_TEMP/advisory-prs-page-1.json"
          gh api \
            --method GET \
            "repos/${GITHUB_REPOSITORY}/pulls" \
            -f state=closed \
            -f head="${GITHUB_REPOSITORY_OWNER}:${BRANCH}" \
            -f sort=created \
            -f direction=desc \
            -f per_page=100 \
            -f page=2 \
            > "$RUNNER_TEMP/advisory-prs-page-2.json"
          jq -s 'add' \
            "$RUNNER_TEMP/advisory-prs-page-1.json" \
            "$RUNNER_TEMP/advisory-prs-page-2.json" \
            > "$RUNNER_TEMP/advisory-pr-history.json"

      # Compares findings, not file bytes. Every report embeds a fresh run
      # timestamp, and a finding legitimately moves from "new" to "unchanged"
      # on the very next run over an identical fleet — so a plain diff is
      # always non-empty and would raise a pull request on every invocation.
      - name: Decide whether the findings changed
        id: publish
        env:
          REPORT_BOT_LOGIN: ${{ steps.report-app.outputs.app-slug && format('{0}[bot]', steps.report-app.outputs.app-slug) || 'github-actions[bot]' }}
        run: |
          if [ ! -f "$RUNNER_TEMP/advisory-pr-history.json" ]; then
            echo "The closed advisory history was not read." >&2
            exit 1
          fi
          decision_args=(
            publication-decision
            --report "$RUNNER_TEMP/advisory/report.json"
            --closed-pr-history "$RUNNER_TEMP/advisory-pr-history.json"
            --repository "$GITHUB_REPOSITORY"
            --branch "$BRANCH"
            --workflow-bot-login "$REPORT_BOT_LOGIN"
          )
          if [ -f reports/report.json ]; then
            decision_args+=(--prior-report reports/report.json)
          fi

          result="$(uv run infra-fleet-advisor "${decision_args[@]}")"
          decision="$(jq -er '.decision' <<< "$result")"
          signature="$(jq -er '.signature' <<< "$result")"
          marker="$(jq -er '.marker' <<< "$result")"

          mkdir -p reports
          cp "$RUNNER_TEMP/advisory/report.json" "$RUNNER_TEMP/advisory/report.md" reports/

          printf 'signature=%s\nmarker=%s\n' "$signature" "$marker" >> "$GITHUB_OUTPUT"
          case "$decision" in
            unchanged)
              echo "changed=false" >> "$GITHUB_OUTPUT"
              echo "Findings and collector coverage are unchanged; nothing to propose."
              ;;
            declined)
              echo "changed=false" >> "$GITHUB_OUTPUT"
              echo "This exact report state was declined; nothing to re-propose."
              ;;
            changed)
              echo "changed=true" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "Unknown publication decision." >&2
              exit 1
              ;;
          esac

      - name: Compose the pull request body
        if: steps.publish.outputs.changed == 'true'
        env:
          REPORT_SIGNATURE_MARKER: ${{ steps.publish.outputs.marker }}
        run: |
          sha="${{ steps.target.outputs.sha }}"
          {
            printf '%s\n' "$REPORT_SIGNATURE_MARKER"
            echo
            echo "Review of [\`${sha:0:7}\`](https://github.com/${TARGET_REPO}/commit/${sha})" \
                 "in \`${TARGET_REPO}\`, produced by the \`fleet-advisory\` workflow."
            echo
            echo "This report PR is the decision record for fleet issue creation. Merging it"
            echo "approves eligible recommendations for the separate fleet publisher."
            echo "The owner then selects valuable fleet issues for an agent to propose fixes."
            echo
            echo "Unsupported positions remain in report coverage and do not create advisor"
            echo "tickets. Historical recommendations with incomplete current collection are"
            echo "deferred. The report records its evidence, coverage and synthesizer."
            echo
            echo "---"
            echo
            cat reports/report.md
          } > "$RUNNER_TEMP/pr-body.md"

      - name: Open or update the advisory pull request
        if: steps.publish.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ steps.report-app.outputs.token || github.token }}
        run: |
          sha="${{ steps.target.outputs.sha }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$BRANCH"
          git add reports
          git commit -m "chore(advisory): report for ${TARGET_REPO}@${sha:0:7}"
          # The checkouts persist no credentials, so authenticate this push
          # explicitly. GITHUB_TOKEN is masked in logs.
          if [ "$HAS_REPORT_APP" != 'true' ]; then
            echo 'Report delivery uses GITHUB_TOKEN; automatic PR quality checks need the optional advisor report App.' >> "$GITHUB_STEP_SUMMARY"
          fi
          git push -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            "HEAD:refs/heads/$BRANCH"

          if [ -n "$(gh pr list --head "$BRANCH" --state open --json number -q '.[].number')" ]; then
            gh pr edit "$BRANCH" --body-file "$RUNNER_TEMP/pr-body.md"
            echo "Updated the open advisory pull request."
          else
            gh pr create \
              --base "${{ github.event.repository.default_branch }}" \
              --head "$BRANCH" \
              --title "chore(advisory): fleet report for ${TARGET_REPO}@${sha:0:7}" \
              --body-file "$RUNNER_TEMP/pr-body.md"
          fi

  # Canary drills: apply each declared violation in drills/ to a throwaway
  # worktree of the reviewed fleet and require its check to fire. A check that
  # stops seeing the fleet, or a drill the fleet has outgrown, turns this job red
  # instead of silently inflating coverage. Read-only and independent of the
  # report: it never blocks or writes a report pull request.
  drills:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Check out the advisor
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Check out the fleet under review
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: ${{ env.TARGET_REPO }}
          ref: ${{ inputs.target_ref || 'main' }}
          path: target
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.11"

      - name: Install the advisor from the lockfile
        run: |
          pip install "uv==0.9.14"
          uv sync --frozen --no-dev

      - name: Run the check drills
        run: |
          uv run --frozen infra-fleet-advisor drill \
            --checkout target --drills drills/fleet-mutations.yaml \
            --policy policy.yaml --intent-dir intent \
            --output-dir "$RUNNER_TEMP/drills" --summary "$GITHUB_STEP_SUMMARY"
