name: Quality

on:
  pull_request:
    branches: [main]
    # The advisory workflow dispatches trusted exact-head validation for its
    # token-authored report PRs, which do not emit an ordinary PR workflow.
    paths-ignore:
      - reports/**
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      pr_number:
        description: Pull request to validate when GITHUB_TOKEN delivery suppresses pull_request
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: quality-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: ${{ inputs.pr_number != '' && 'Advisor Quality (dispatched)' || 'Advisor Quality' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.11"

      - name: Set up uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true

      - name: Resolve pull request metadata
        if: github.event_name == 'pull_request' || inputs.pr_number != ''
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number || inputs.pr_number }}
        run: |
          metadata="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}")"
          {
            echo "title=$(jq -r '.title' <<< "$metadata")"
            echo "base=$(jq -r '.base.sha' <<< "$metadata")"
            echo "head=$(jq -r '.head.sha' <<< "$metadata")"
          } >> "$GITHUB_OUTPUT"

      - name: Install locked dependencies
        run: make setup

      - name: Validate pull request title and commits
        if: github.event_name == 'pull_request' || inputs.pr_number != ''
        env:
          PR_TITLE: ${{ steps.pr.outputs.title }}
          BASE_SHA: ${{ steps.pr.outputs.base }}
          HEAD_SHA: ${{ steps.pr.outputs.head }}
        run: |
          printf '%s\n' "$PR_TITLE" > "$RUNNER_TEMP/pr-title.txt"
          uv run --frozen gitlint --msg-filename "$RUNNER_TEMP/pr-title.txt"
          uv run --frozen gitlint --commits "${BASE_SHA}..${HEAD_SHA}"

      - name: Run lint, types and unit tests
        run: make check

      - name: Check out the fleet
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: ImranAdan/infra-fleet-public
          path: target
          persist-credentials: false

      - name: Run check drills
        run: |
          uv run --frozen infra-fleet-advisor drill \
            --checkout target --drills drills/fleet-mutations.yaml \
            --policy policy.yaml --intent-dir intent \
            --output-dir "$RUNNER_TEMP/drills" --summary "$GITHUB_STEP_SUMMARY"

      - name: Compare the base advisor with this change
        if: github.event_name == 'pull_request' || inputs.pr_number != ''
        env:
          BASE_SHA: ${{ steps.pr.outputs.base }}
        run: scripts/ratchet-guard.sh target "$BASE_SHA" "$RUNNER_TEMP/ratchet"

      # The advisory workflow contains substantial shell. actionlint runs
      # shellcheck over those blocks as well as validating Actions syntax.
      - name: Lint workflows
        run: docker run --rm -v "${PWD}:/repo" -w /repo rhysd/actionlint:1.7.7

      - name: Scan source and dependencies
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          severity: CRITICAL,HIGH
          ignore-unfixed: false
          # Fixtures are intentionally insecure, and target is the separately
          # reviewed Fleet checkout used only by drills and the ratchet.
          skip-dirs: tests/fixtures,target
          exit-code: "1"
          format: table
          timeout: 10m0s
