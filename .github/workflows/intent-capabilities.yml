name: Publish intent capability gaps

# Turns human-ratified unverified evaluations into advisor implementation work.
# It writes only issues in this repository. A capability gap is never published
# to the fleet as though it were an evidence-backed divergence.
on:
  push:
    branches: [main]
    paths:
      - reports/report.json
      - .github/workflows/intent-capabilities.yml
      - src/infra_fleet_advisor/runtime/capability_publication.py
      - src/infra_fleet_advisor/runtime/github_issues.py
      - src/infra_fleet_advisor/runtime/cli.py
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: intent-capability-publication

jobs:
  publish:
    name: Publish advisor capability work
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the advisor
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.11"

      - name: Set up uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true

      - name: Install locked dependencies
        run: make setup

      - name: Build the capability plan
        id: plan
        run: |
          uv run infra-fleet-advisor capability-plan \
            --report reports/report.json \
            --policy policy.yaml \
            --intent-dir intent \
            --output "$RUNNER_TEMP/intent-capability-plan.json"
          count="$(jq -er '.actions | length' "$RUNNER_TEMP/intent-capability-plan.json")"
          echo "count=$count" >> "$GITHUB_OUTPUT"

      - name: Create or update capability work
        if: steps.plan.outputs.count != '0'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          uv run infra-fleet-advisor publish-capability-gaps \
            --report reports/report.json \
            --policy policy.yaml \
            --intent-dir intent \
            --repository "$GITHUB_REPOSITORY" \
            --workflow-bot-login "github-actions[bot]"
