# Canary mutations for infra-fleet-public. Each drill is one deliberate,
# literal violation of a declared position in the real fleet. `drill` applies
# it in a throwaway worktree and expects the named proposition to diverge (or,
# with `expect: declared_unverified`, to lose a proof it held), so
# a check that silently stops seeing the fleet (a moved file, a renamed block)
# fails loudly instead of inflating coverage. Data only: `find` and `replace`
# are literal text, every occurrence in `path` is replaced, and a `find` that
# no longer matches marks the drill stale rather than passing it.
drills:
  - proposition: S-001
    path: .github/workflows/infra-apply.yml
    find: "id-token: write"
    replace: "id-token: none"
  - proposition: S-002
    path: k8s/applications/load-harness/deployment.yaml
    find: "allowPrivilegeEscalation: false"
    replace: "allowPrivilegeEscalation: true"
  - proposition: S-007
    path: infrastructure/permanent/github-oidc.tf
    find: 'Action    = "ecr:GetAuthorizationToken"'
    replace: 'Action    = "ecr:*"'
  # S-007 can be proven, so IAM the collector cannot read must cost the proof:
  # a repository policy is a policy document outside the parsed set.
  - proposition: S-007
    path: infrastructure/permanent/ecr.tf
    find: 'resource "aws_ecr_lifecycle_policy" "load_harness" {'
    replace: 'resource "aws_ecr_repository_policy" "load_harness" {'
    expect: declared_unverified
  - proposition: S-010
    path: .github/dependabot.yml
    find: 'directory: "/platform/local/git-server"'
    replace: 'directory: "/platform/local/elsewhere"'
  - proposition: S-011
    path: .github/workflows/load-harness-publish.yml
    find: "exit-code: 1"
    replace: "exit-code: 0"
  - proposition: R-001
    path: k8s/applications/load-harness/deployment.yaml
    find: "maxUnavailable: 0"
    replace: "maxUnavailable: 1"
  # Demand scaling needs a maximum above the minimum.
  - proposition: C-002
    path: infrastructure/staging/eks.tf
    find: "max_size = 3"
    replace: "max_size = 1"
  - proposition: C-003
    path: infrastructure/staging/eks.tf
    find: "cloudwatch_log_group_retention_in_days = 14"
    replace: "cloudwatch_log_group_retention_in_days = 90"
  - proposition: C-004
    path: infrastructure/permanent/ecr.tf
    find: 'tagStatus   = "any"'
    replace: 'tagStatus   = "tagged"'
  - proposition: C-005
    path: infrastructure/staging/main.tf
    find: "tags = local.cost_tags"
    replace: "tags = {}"
  - proposition: M-001
    path: fleet
    find: "render|setup|up|"
    replace: "render|up|"
  - proposition: M-002
    path: scripts/fleet-profiles/local.sh
    find: "Next: ./fleet up --profile local"
    replace: "Then start the local profile"
  - proposition: M-003
    path: scripts/fleet-profiles/aws-staging.sh
    find: '"confirm_destroy=$confirmation"'
    replace: "'confirm_destroy=destroy staging'"
  - proposition: S-004
    path: k8s/applications/platform/networkpolicy.yaml
    find: "namespace: applications"
    replace: "namespace: observability"
  # The broker admits only S-015's declared matrix: moving the client rule to
  # another namespace on the admin port must diverge. Broader shapes (ipBlock,
  # Exists selectors, ports: [{}]) are unit-tested; drills are one per path.
  - proposition: S-015
    path: k8s/infrastructure/messaging/networkpolicy.yaml
    find: "              kubernetes.io/metadata.name: applications\n      ports:\n        - protocol: TCP\n          port: 4222"
    replace: "              kubernetes.io/metadata.name: default\n      ports:\n        - protocol: TCP\n          port: 8222"
  # A namespace selector that only says the name label Exists admits every
  # namespace; it must not count as a named peer.
  - proposition: S-003
    path: k8s/applications/platform/networkpolicy.yaml
    find: "            matchLabels:\n              kubernetes.io/metadata.name: observability"
    replace: "            matchExpressions:\n              - key: kubernetes.io/metadata.name\n                operator: Exists"
  - proposition: S-005
    path: k8s/routing/gateway.yaml
    find: "            scheme: https"
    replace: "            scheme: http"
  - proposition: S-009
    path: k8s/applications/platform/hpa.yaml
    find: "# Horizontal Pod Autoscaler for ${APP_NAME}"
    replace: "apiVersion: rbac.authorization.k8s.io/v1\nkind: RoleBinding\nmetadata:\n  name: drill-default-view\n  namespace: applications\nsubjects:\n  - kind: ServiceAccount\n    name: default\nroleRef:\n  apiGroup: rbac.authorization.k8s.io\n  kind: ClusterRole\n  name: view\n---\napiVersion: apps/v1\nkind: Deployment\nmetadata:\n  name: ${APP_NAME}-token-drill\n  namespace: applications\nspec:\n  strategy:\n    type: RollingUpdate\n    rollingUpdate:\n      maxUnavailable: 0\n      maxSurge: 1\n  selector:\n    matchLabels:\n      app: ${APP_NAME}\n  template:\n    metadata:\n      labels:\n        app: ${APP_NAME}\n    spec:\n      automountServiceAccountToken: true\n      securityContext:\n        runAsNonRoot: true\n        seccompProfile:\n          type: RuntimeDefault\n      containers:\n        - name: token-drill\n          image: app\n          securityContext:\n            allowPrivilegeEscalation: false\n            readOnlyRootFilesystem: true\n            capabilities:\n              drop: [ALL]\n          resources:\n            requests:\n              cpu: 10m\n              memory: 16Mi\n            limits:\n              cpu: 20m\n              memory: 32Mi\n          readinessProbe:\n            exec:\n              command: [true]\n---\n# Horizontal Pod Autoscaler for ${APP_NAME}"
  - proposition: S-006
    path: infrastructure/permanent/main.tf
    find: "provider \"aws\" {\n  region = \"eu-west-2\""
    replace: "module \"eks\" {\n  source                 = \"terraform-aws-modules/eks/aws\"\n  version                = \"21.25.0\"\n  endpoint_public_access = true\n  enabled_log_types      = []\n}\n\nprovider \"aws\" {\n  region = \"eu-west-2\""
  - proposition: M-004
    path: k8s/profiles/local/policies/require-local-images.yaml
    find: "container.image.startsWith('fleet-local-registry:5000/')"
    replace: "container.image.startsWith('fleet-local-registry:5000/load-harness:')"
  # The selection is one value: including a second app diverges.
  - proposition: M-004
    path: k8s/applications/kustomization.yaml
    find: "  - load-harness\n"
    replace: "  - load-harness\n  - podinfo\n"
  - proposition: M-005
    variants:
      - path: .github/workflows/autonomous-merge.yml
        find: "run: python3 .github/scripts/autonomous_merge.py"
        replace: "run: echo autonomous merge disabled"
      - path: .github/workflows/intent-gate.yml
        find: "name: Intent Gate"
        replace: "name: Intent Gate without autonomous follow-up"
  - proposition: S-008
    path: applications/load-harness/src/load_harness/app.py
    find: 'app.config["SESSION_COOKIE_SAMESITE"] = "Lax"'
    replace: 'app.config["SESSION_COOKIE_SAMESITE"] = "None"'
  # The nightly release must reach zero; lowering desired capacity only to one
  # leaves the worker billed around the clock.
  - proposition: C-001
    path: infrastructure/staging/cluster-autoscaler.tf
    find: "desired_capacity       = 0"
    replace: "desired_capacity       = 1"
  # A violation that exists only after rendering: the local profile's own
  # patch opens ingress to every address while the shared base stays safe.
  - proposition: S-003
    path: k8s/profiles/local/applications/kustomization.yaml
    find: "  - target:\n      kind: HorizontalPodAutoscaler\n    patch: |-\n      - op: replace\n        path: /spec/maxReplicas\n        value: 3"
    replace: "  - target:\n      kind: NetworkPolicy\n    patch: |-\n      - op: replace\n        path: /spec/ingress/1/from/0\n        value: {ipBlock: {cidr: 0.0.0.0/0}}"
  # Docs must not point at files that do not exist: rename one link target.
  - proposition: M-007
    path: README.md
    find: "[Local Kubernetes](docs/LOCAL-KUBERNETES.md)"
    replace: "[Local Kubernetes](docs/LOCAL-K8S.md)"
  # Agents need the opt-in marker for the trusted merge worker to act.
  - proposition: M-006
    path: .github/pull_request_template.md
    find: "<!-- autonomous-merge -->"
    replace: "<!-- held for review -->"
  # Platform operability (platform_collector). R-002, R-004, R-005 and S-016
  # list a second variant for the fleet before its fix landed, where the
  # position is already divergent; the first variant is the real drill.
  - proposition: R-002
    variants:
      - path: k8s/infrastructure/messaging/nats.yaml
        find: "  upgrade:\n    remediation:\n      retries: 3"
        replace: "  upgrade:\n    remediation:\n      retries: 0"
      - path: k8s/infrastructure/messaging/nats.yaml
        find: "# NATS JetStream - the platform's message broker"
        replace: "# NATS JetStream broker"
  - proposition: R-003
    path: k8s/applications/platform/canary.yaml
    find: "maxWeight: 50"
    replace: "maxWeight: 100"
  - proposition: R-004
    variants:
      - path: k8s/applications/load-harness/fleet-app.yaml
        find: "  APP_MESSAGING_PREFIX: eip"
        replace: "  APP_MESSAGING_PREFIX: Eip!"
      - path: k8s/applications/load-harness/fleet-app.yaml
        find: "  APP_FAULT_ENV: FAIL_RATE=1.0"
        replace: "  APP_FAULT_ENV: FAIL_RATE=0.9"
  # Budgeting the canary's pods instead of the Flagger primary protects nothing.
  - proposition: R-005
    variants:
      - path: k8s/profiles/aws-staging/applications/pdb.yaml
        find: "      app: ${APP_NAME}-primary"
        replace: "      app: ${APP_NAME}-standby"
      - path: k8s/profiles/aws-staging/applications/kustomization.yaml
        find: "this tag on the newest release"
        replace: "this tag on the latest release"
  - proposition: S-016
    variants:
      - path: k8s/infrastructure/namespaces/applications.yaml
        find: "pod-security.kubernetes.io/enforce: restricted"
        replace: "pod-security.kubernetes.io/enforce: baseline"
      - path: k8s/infrastructure/namespaces/applications.yaml
        find: "# Namespace for application workloads"
        replace: "# Application workloads namespace"
  # Every 256Mi request becomes 2Gi: the local profile exceeds its budget.
  - proposition: C-006
    path: k8s/infrastructure/observability/kube-prometheus-stack.yaml
    find: "memory: 256Mi"
    replace: "memory: 2Gi"
  - proposition: C-007
    path: k8s/infrastructure/observability/kube-prometheus-stack.yaml
    find: 'retentionSize: "1GB"'
    replace: 'retentionSize: ""'
  - proposition: M-008
    path: .github/workflows/dora-metrics.yml
    find: "      - Load Harness Publish\n"
    replace: "      - Load Harness Release\n"
  # Dropping a reference leaves the broker's NetworkPolicy applied by nothing.
  - proposition: M-009
    path: k8s/infrastructure/messaging/kustomization.yaml
    find: "  - networkpolicy.yaml\n"
    replace: "  # networkpolicy.yaml is no longer applied\n"
