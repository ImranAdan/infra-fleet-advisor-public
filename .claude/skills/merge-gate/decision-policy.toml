# Every surfaced category names one decider. Deterministic evidence handles
# reversible changes only after the declared advisor check passes from its
# trusted workflow. The owner keeps durable authority, access and migrations.

[[rule]]
id = "dependency-pinned"
category = "dependency"
decider = "evidence"
guidance = """Require remote actions at a full commit SHA, container bases at a
fixed tag or digest, and exactly pinned requirements. The gate validates these
forms before accepting the head's passing tests and security scans."""

[[rule]]
id = "dependency-manifest"
category = "dependency-manifest"
decider = "evidence"
guidance = """Require each changed dependency manifest to carry its sibling
resolved lockfile where that ecosystem has one. Accept the locked graph only
with passing tests and security scans."""

[[rule]]
id = "intent-and-policy"
category = "intent-policy"
decider = "owner"
guidance = """Treat declared intent and the advisor intent gate as the captain.
Approve when the change follows that intent or an explicit owner request and
keeps the position provable. Reject silent weakening of a check, drill or rule."""

[[rule]]
id = "decision-record"
category = "decision-record"
decider = "evidence"
guidance = """Accept reversible decision-record prose only after exact-head
checks and recorded verification pass. A change that also touches declared
intent or merge authority is routed to the owner by its additional category."""

[[rule]]
id = "product-requirements"
category = "product-requirements"
decider = "evidence"
guidance = """Accept reversible product-requirement prose only after exact-head
checks and recorded verification pass. Declared intent and merge authority are
separate owner categories and cannot be changed through this rule."""

[[rule]]
id = "permission-narrowed"
category = "permission-removed"
decider = "evidence"
guidance = """Accept a removed permission after the affected head workflows and
validation pass. Any added or widened permission is a separate owner category."""

[[rule]]
id = "workflow-change"
category = "workflow"
decider = "evidence"
guidance = """Accept non-gate automation only after action validation and all
head checks pass. Privileged triggers, merge-control logic, credentials, wider
permissions, unpinned remote actions and gate-producing paths are blocked or
routed to the owner by deterministic scope rules."""

[[rule]]
id = "permission-widened"
category = "permission-added"
decider = "owner"
guidance = "A new or wider permission changes what a compromised workload can do."

[[rule]]
id = "credential"
category = "credential"
decider = "owner"
guidance = "A new secret reference changes who can act as this repository."

[[rule]]
id = "iam"
category = "iam"
decider = "owner"
guidance = "IAM changes what cloud identities may do."

[[rule]]
id = "permanent-infrastructure"
category = "permanent-infrastructure"
decider = "owner"
guidance = "The permanent stack outlives rebuilds and holds the OIDC trust."

[[rule]]
id = "state-schema-data-migration"
category = "migration"
decider = "owner"
guidance = "State, schema and data migrations are not proven reversible by reverting a merge commit."

[[rule]]
id = "merge-authority"
category = "merge-authority"
decider = "owner"
guidance = "The gate, judge, policy and merge rules determine agent authority."

[judge]
trusted_author = "github-actions[bot]"
model = "claude-opus-5-5"

[evidence]
required_checks = [
  { group = "ratchet", name = "Ratchet guard", workflow = ".github/workflows/quality.yml" },
]
